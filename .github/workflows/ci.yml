name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Dummy values so the build works without real secrets.
      # Replace with ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }} etc. once secrets are set.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
    steps:
      - uses: actions/checkout@v4

      - name: Check for package.json
        id: pkg
        run: |
          if [ -f package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; echo "::notice::No package.json yet - skipping Node checks"; fi

      - uses: actions/setup-node@v4
        if: steps.pkg.outputs.exists == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.pkg.outputs.exists == 'true'
        run: npm ci

      - name: Lint
        if: steps.pkg.outputs.exists == 'true'
        run: npm run lint --if-present

      - name: Type check
        if: steps.pkg.outputs.exists == 'true' && hashFiles('tsconfig.json') != ''
        run: npx tsc --noEmit

      - name: Test
        if: steps.pkg.outputs.exists == 'true'
        run: npm test --if-present

      - name: Build
        if: steps.pkg.outputs.exists == 'true'
        run: npm run build --if-present
